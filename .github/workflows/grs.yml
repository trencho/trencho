name: Update README cards

on:
    schedule:
        # Weekly, not daily. Profile statistics move slowly -- a contribution graph and a language
        # breakdown are not meaningfully different one morning to the next -- while a daily
        # regeneration committed ~365 SVG diffs a year to master for that non-difference.
        #
        # If you change this, change MAX_AGE_HOURS in card-freshness.yml with it. That detector
        # measures the age of the last successful run against a fixed budget, so widening the
        # cadence without widening the budget makes it report a healthy job as broken.
        - cron: "0 0 * * 1"
    workflow_dispatch:

# Least privilege at the top so a step added later cannot silently inherit write scope;
# the build job re-declares the contents: write it genuinely needs.
permissions:
    contents: read

# One card refresh at a time. Two overlapping runs both commit to master and race.
concurrency:
    group: update-readme-cards
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            # A plain GITHUB_TOKEN checkout, and the push at the end of this job uses it.
            # That works because master carries NO branch protection (removed 2026-08-21): a
            # required status check made this push impossible, since a direct push cannot carry
            # one and GitHub refuses to excuse GITHUB_TOKEN from it on a personal repository.
            # If protection is ever restored, this job breaks again at the push -- and
            # card-freshness.yml is what will say so.
            - uses: actions/checkout@v7.0.1

            - name: Generate stats card
              uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
              with:
                  card: stats
                  options: username=${{ github.repository_owner }}&show_icons=true
                  path: profile/stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate top languages card
              uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
              with:
                  card: top-langs
                  options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
                  path: profile/top-langs.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate pin card
              uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
              with:
                  card: pin
                  options: username=${{ github.repository_owner }}&repo=air-quality-rest-api
                  path: profile/pin.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit cards
              run: |
                  git config user.name "Aleksandar Trenchevski"
                  git config user.email "atrenchevski@gmail.com"
                  git add profile/*.svg
                  git commit -m "Update README cards" || exit 0
                  git push
