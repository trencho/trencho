name: Update README cards

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

# Least privilege at the top so a step added later cannot silently inherit write scope;
# the build job re-declares the contents: write it genuinely needs.
permissions:
    contents: read

# One card refresh at a time. Two overlapping runs both commit to master and race.
concurrency:
    group: update-readme-cards
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            # master requires the `build` status check, and a direct push cannot carry one, so
            # every run since 2026-08-17 generated the cards and was rejected at the push with
            # `GH006 ... Required status check "build" is expected`. GITHUB_TOKEN cannot be
            # excused from it either: GitHub refuses a GitHub Actions bypass actor on a personal
            # repository ("must be part of the ruleset source or owner organization"). So the push
            # is made by a PAT belonging to an admin, which `enforce_admins: false` lets through.
            - name: Assert the push credential is configured
              env:
                  TOKEN: ${{ secrets.CARD_PUSH_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ -z "${TOKEN}" ]; then
                      echo "::error::CARD_PUSH_TOKEN is not set, so the push at the end of this job would be"
                      echo "::error::rejected by branch protection exactly as it has been since 2026-08-17."
                      echo "::error::Mint a PAT with contents:write on this repo and add it as CARD_PUSH_TOKEN."
                      exit 1
                  fi

            # persist-credentials keeps this token in the local git config, which is what the
            # `Commit cards` step below pushes with.
            - uses: actions/checkout@v7.0.1
              with:
                  token: ${{ secrets.CARD_PUSH_TOKEN }}

            - name: Generate stats card
              uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
              with:
                  card: stats
                  options: username=${{ github.repository_owner }}&show_icons=true
                  path: profile/stats.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate top languages card
              uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
              with:
                  card: top-langs
                  options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
                  path: profile/top-langs.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate pin card
              uses: readme-tools/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
              with:
                  card: pin
                  options: username=${{ github.repository_owner }}&repo=air-quality-rest-api
                  path: profile/pin.svg
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit cards
              run: |
                  git config user.name "Aleksandar Trenchevski"
                  git config user.email "atrenchevski@gmail.com"
                  git add profile/*.svg
                  git commit -m "Update README cards" || exit 0
                  git push
