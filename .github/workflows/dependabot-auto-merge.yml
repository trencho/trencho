# Dependabot auto-merge skeleton — drop into a target project as
# .github/workflows/dependabot-auto-merge.yml. See references/dependency-automation-guide.md.
#
# Lands EVERY update type automatically — patch, minor and major — once CI is green. The only
# thing held back is a PRE-RELEASE target version; see the guard step below.
#
# INERT until two repo settings are on (the workflow can't set these):
#   1. Settings -> General -> "Allow auto-merge".
#   2. Branch protection on the default branch with the CI job(s) as REQUIRED status checks,
#      and set them **strict** ("Require branches to be up to date before merging") — see below.
#      Without required checks, `gh pr merge --auto` merges immediately (no real gate).
#   A red REQUIRED check blocks every auto-merge — keep an unfixed security scan non-required.
#
# ---------------------------------------------------------------------------------------------
# WITH MAJORS MERGING, CI IS THE ENTIRE GATE.
#
# Under a patch/minor policy a broken major was caught by a human reading the PR. That reviewer
# is gone now, so the required status checks are the only thing standing between an upstream
# breaking change and the default branch. Two consequences:
#   - The CI job must genuinely exercise the project (build AND test), not just compile it.
#   - `strict` is no longer a nicety — see the next block.
#
# WHY `strict` MATTERS, and not just for tidiness.
#
# An auto-merge lands via GITHUB_TOKEN, and GitHub raises NO workflow events for its own token
# (anti-recursion). So the resulting commit on the base branch gets no CI run, no security scan
# and no deploy: **the merged state of the branch is never verified.** Two PRs that were each
# green against an older base can combine into a broken tree and sit there un-flagged. Observed:
# two Dependabot PRs merged 30 seconds apart produced a malformed lockfile that broke a default
# branch for three days, because each PR's CI had only ever seen its own base.
#
# `strict` closes it by refusing a stale branch, so the PR's green CI *is* the merge result:
#   gh api -X PATCH repos/OWNER/REPO/branches/BRANCH/protection/required_status_checks \
#     -F strict=true      # targeted — the full PUT .../protection resends (and can drop) everything
#
# Trade-off worth knowing: with `strict`, a PR whose branch has fallen behind will sit queued
# until something updates it. Dependabot normally rebases its own PRs; if you see them stall,
# comment `@dependabot rebase`. Do NOT reach for `gh pr update-branch` in a workflow — a branch
# updated by GITHUB_TOKEN gets no CI on the new head, so it would be up to date and permanently
# ungateable. (The self-gated variant automates this; see github-actions-automerge-selfgated.yml.)
# ---------------------------------------------------------------------------------------------
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Gate on the PR's AUTHOR, not `github.actor`: the actor is whoever triggered THIS run, so any
    # human touching the branch (an "Update branch" click, a rebase) makes `github.actor` false and
    # the job skips. `pull_request.user.login` is the PR opener and is stable. This is the gate
    # GitHub's own Dependabot example uses.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # -----------------------------------------------------------------------------------------
      # Pre-release guard — the one thing that does NOT auto-merge.
      #
      # Registries expose a release channel, so for npm/pip/Maven/… a pre-release is not proposed
      # unless you are already on one. The `docker` and `docker-compose` ecosystems match image
      # TAGS, which carry no channel metadata: a release candidate reads as an ordinary version and
      # is scored by the numbers in front of it. `python:3.14.6-slim` -> `python:3.15.0rc1-slim`
      # scored a routine MINOR and auto-merged into a production image (2026-08-15).
      #
      # This cannot be expressed in dependabot.yml — `ignore.versions` takes version RANGES, not
      # glob patterns (dependabot-core#15154 is open on exactly this) — so the guard lives here.
      #
      # `new-version` is empty for a GROUPED PR, so the metadata JSON is inspected too — but only
      # its newVersion VALUES. Grepping the raw JSON blob instead matches the KEY "prevVersion",
      # which contains "pre", so it held every Dependabot PR ever opened; that bug shipped in
      # 0.1.18 and is fixed here. Failing toward "hold" is deliberate — a missed merge is a
      # nuisance, a shipped release candidate is an incident.
      # -----------------------------------------------------------------------------------------
      - name: Check for a pre-release target
        id: prerelease
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # A token counts only where it is not buried inside a longer alphabetic word: `3.15.0rc1`
          # is held, while `26.7.0-alpine` and `1.31-alpine` are ordinary releases and pass. Longest
          # alternatives first so `preview` is reported as itself rather than as `pre`.
          pattern='(^|[^a-zA-Z])(preview|insiders|snapshot|nightly|canary|alpha|beta|next|dev|pre|rc)([^a-zA-Z]|$)'
          held=false
          offender=""
          if [ -n "${NEW_VERSION:-}" ] && printf '%s' "$NEW_VERSION" | grep -qiE "$pattern"; then
            held=true
            offender="$NEW_VERSION"
          fi
          if [ -n "${UPDATED_JSON:-}" ]; then
            # jq ships on GitHub-hosted runners. On a self-hosted one without it this holds every
            # PR, so say which of the two failures it is -- an unexplained fleet-wide freeze is
            # exactly how the 0.1.18 bug went unnoticed for a day.
            if ! command -v jq >/dev/null 2>&1; then
              held=true
              offender="jq unavailable - cannot inspect grouped metadata"
            elif versions=$(printf '%s' "$UPDATED_JSON" | jq -r '.[]?.newVersion // empty'); then
              hit=$(printf '%s\n' "$versions" | grep -iE "$pattern" | head -n 1 || true)
              if [ -n "$hit" ]; then
                held=true
                offender="$hit"
              fi
            else
              held=true
              offender="unparseable metadata"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "offender=$offender" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "pre-release target detected ('$offender') - not auto-merging."
          fi

      - name: Enable auto-merge
        if: ${{ steps.prerelease.outputs.held == 'false' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # If branch protection requires an approval, add before the merge step:
        #   gh pr review --approve "$PR_URL"

      - name: Explain a held pre-release
        if: ${{ steps.prerelease.outputs.held == 'true' }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held: this bump targets a **pre-release** version (\`$OFFENDER\`). Every other update type auto-merges; pre-releases need a human, because an image tag like \`3.15.0rc1\` is scored as an ordinary version bump. Merge manually if it is intended."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The offending VALUE, not `new-version` — which is empty on exactly the grouped PRs the
          # metadata check exists to cover, and would report the hold against a blank version.
          OFFENDER: ${{ steps.prerelease.outputs.offender }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
