# Self-gating Dependabot auto-merge — for FREE PRIVATE repos, where GitHub's native
# auto-merge (and branch protection / rulesets) are Pro-only. This does NOT use
# `gh pr merge --auto`; instead it waits for the named CI checks to pass, then merges
# the PR directly. Lands EVERY update type — patch, minor and major. The only thing held
# back is a PRE-RELEASE target version; see the guard step below.
# Public or Pro repos should prefer the simpler native variant (github-actions-automerge.yml).
#
# Set REQUIRED_CHECKS to the exact check-run name(s) that gate a merge, ONE PER LINE. That is
# a job's `name:` when it has one, and its job id otherwise — get this wrong and the gate waits
# for a check that never appears, then times out instead of merging. List ONLY the checks that
# must be green; others (e.g. a red-but-accepted security scan) are ignored, which is the point
# of naming them explicitly. Read the names off a real run, not off the YAML:
#   gh run view <run-id> --json jobs --jq '.jobs[].name'
# and confirm they appear on a PULL REQUEST head — a workflow that is `pull_request`-only produces
# no check at all on a push commit, so a name verified against master may never appear on a PR.
#
# ---------------------------------------------------------------------------------------------
# WITH MAJORS MERGING, THE NAMED CHECKS ARE THE ENTIRE GATE.
#
# Under a patch/minor policy a broken major was caught by a human reading the PR. That reviewer is
# gone now, so REQUIRED_CHECKS is the only thing standing between an upstream breaking change and
# the default branch. Name the job that actually builds AND tests — not a lint-only job.
#
# DOCUMENTED DEVIATION for this repo: `build` IS a lint-only job, because this repo is a README, a
# profile/ folder and one scheduled workflow — there is nothing to compile and nothing to test. The
# only thing a Dependabot PR here can break is a `uses:` pin, and actionlint plus a YAML parse
# catches exactly that. Stating it because the guidance above is right in general and would
# otherwise read as quietly ignored.
#
# IMPORTANT — what this workflow does NOT verify, and the setting that fixes it.
#
# A merge performed with GITHUB_TOKEN (which is what the final `gh pr merge` below is) raises NO
# workflow events: GitHub suppresses them to prevent recursion. So the merge commit this creates
# gets no CI run, no security scan and no deploy. **Nothing ever verifies the merged state of the
# base branch.** Two PRs that were each green against an older base can therefore combine into a
# broken tree, and it will sit there un-flagged — observed in the wild: two Dependabot PRs merged
# 30 seconds apart produced a malformed lockfile that broke the default branch for three days.
#
# The fix is to require branches to be up to date before merging ("strict" required status
# checks), so the PR's green CI *is* the merge result:
#   gh api -X PATCH repos/OWNER/REPO/branches/BRANCH/protection/required_status_checks \
#     -F strict=true                      # targeted; the full PUT resends every setting
# On a FREE PRIVATE repo that returns 403 (Pro-only) — the same limitation that makes this
# self-gated variant necessary at all. There, the residual risk is real and has to be accepted or
# handled another way, and it is larger now that majors merge unattended.
#
# The BEHIND handler in the run block below is what keeps auto-merge working once strict is on.
# ---------------------------------------------------------------------------------------------
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    # Gate on the PR's AUTHOR, not `github.actor`: the actor is whoever triggered THIS run, so any
    # human touching the branch (an "Update branch" click, a rebase) makes `github.actor` false and
    # the job skips. `pull_request.user.login` is the PR opener and is stable. This is the gate
    # GitHub's own Dependabot example uses.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # -----------------------------------------------------------------------------------------
      # Pre-release guard — the one thing that does NOT auto-merge.
      #
      # Registries expose a release channel, so for npm/pip/Maven/… a pre-release is not proposed
      # unless you are already on one. The `docker` and `docker-compose` ecosystems match image
      # TAGS, which carry no channel metadata: a release candidate reads as an ordinary version and
      # is scored by the numbers in front of it. `python:3.14.6-slim` -> `python:3.15.0rc1-slim`
      # scored a routine MINOR and auto-merged into a production image (2026-08-15).
      #
      # This cannot be expressed in dependabot.yml — `ignore.versions` takes version RANGES, not
      # glob patterns (dependabot-core#15154 is open on exactly this) — so the guard lives here.
      #
      # `new-version` is empty for a GROUPED PR, so the metadata JSON is inspected too — but only
      # its newVersion VALUES. Grepping the raw JSON blob instead matches the KEY "prevVersion",
      # which contains "pre", so it held every Dependabot PR ever opened; that bug shipped in
      # 0.1.18 and is fixed here. Failing toward "hold" is deliberate — a missed merge is a
      # nuisance, a shipped release candidate is an incident.
      # -----------------------------------------------------------------------------------------
      - name: Check for a pre-release target
        id: prerelease
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # A token counts only where it is not buried inside a longer alphabetic word: `3.15.0rc1`
          # is held, while `26.7.0-alpine` and `1.31-alpine` are ordinary releases and pass. Longest
          # alternatives first so `preview` is reported as itself rather than as `pre`.
          pattern='(^|[^a-zA-Z])(preview|insiders|snapshot|nightly|canary|alpha|beta|next|dev|pre|rc)([^a-zA-Z]|$)'
          held=false
          offender=""
          if [ -n "${NEW_VERSION:-}" ] && printf '%s' "$NEW_VERSION" | grep -qiE "$pattern"; then
            held=true
            offender="$NEW_VERSION"
          fi
          if [ -n "${UPDATED_JSON:-}" ]; then
            # jq ships on GitHub-hosted runners. On a self-hosted one without it this holds every
            # PR, so say which of the two failures it is -- an unexplained fleet-wide freeze is
            # exactly how the 0.1.18 bug went unnoticed for a day.
            if ! command -v jq >/dev/null 2>&1; then
              held=true
              offender="jq unavailable - cannot inspect grouped metadata"
            elif versions=$(printf '%s' "$UPDATED_JSON" | jq -r '.[]?.newVersion // empty'); then
              hit=$(printf '%s\n' "$versions" | grep -iE "$pattern" | head -n 1 || true)
              if [ -n "$hit" ]; then
                held=true
                offender="$hit"
              fi
            else
              held=true
              offender="unparseable metadata"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "offender=$offender" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "pre-release target detected ('$offender') - not auto-merging."
          fi

      - name: Explain a held pre-release
        if: ${{ steps.prerelease.outputs.held == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The offending VALUE, not `new-version` — which is empty on exactly the grouped PRs the
          # metadata check exists to cover, and would report the hold against a blank version.
          OFFENDER: ${{ steps.prerelease.outputs.offender }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held: this bump targets a **pre-release** version (\`$OFFENDER\`). Every other update type auto-merges; pre-releases need a human, because an image tag like \`3.15.0rc1\` is scored as an ordinary version bump. Merge manually if it is intended."

      - name: Wait for required checks, then merge
        if: ${{ steps.prerelease.outputs.held == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # One check-run NAME per line. These are the names GitHub displays, which is a job's
          # `name:` when it has one and its job id otherwise — naming the job id here for a job
          # that has a `name:` waits for a check that never appears, and the loop times out
          # instead of merging. One per line (not space-separated) so a name containing spaces,
          # like "build and test (JDK 25)", is not split apart.
          REQUIRED_CHECKS: |
            build
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------------------------------
          # If the branch is BEHIND, ask Dependabot to rebase and stop. Only relevant once the branch
          # has `strict` required status checks ("Require branches to be up to date before merging"),
          # which you should enable -- see the header note on why an auto-merged commit is never
          # verified. Until then mergeStateStatus never reports BEHIND and this is a no-op.
          #
          # Ask DEPENDABOT to update the branch; do NOT use `gh pr update-branch` here. A branch
          # updated with GITHUB_TOKEN produces no CI run (GitHub raises no workflow events for its
          # own token), so the branch would become up to date with NO checks on the new head --
          # permanently unable to satisfy the very gate it was updated for. Dependabot's own push
          # does trigger CI, and the resulting `synchronize` re-runs this workflow on the new head.
          # ---------------------------------------------------------------------------------------
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            gh pr comment "$PR_URL" --body '@dependabot rebase'
            echo "branch is behind the base; asked Dependabot to rebase. A later run will merge it."
            exit 0
          fi

          for _ in $(seq 1 60); do   # up to ~20 min (60 * 20s)
            pending=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              row=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                --jq ".check_runs[] | select(.name==\"$name\") | [.status,(.conclusion // \"\")] | @tsv" | tail -1)
              if [ -z "$row" ]; then pending=1; continue; fi          # check not registered yet
              status=$(printf '%s' "$row" | cut -f1)
              concl=$(printf '%s' "$row" | cut -f2)
              [ "$status" != "completed" ] && pending=1
              if [ "$status" = "completed" ] && [ "$concl" != "success" ]; then
                echo "required check '$name' concluded '$concl' — not merging."; exit 1
              fi
            done <<< "$REQUIRED_CHECKS"
            if [ "$pending" -eq 1 ]; then echo "waiting for required checks..."; sleep 20; continue; fi
            echo "all required checks green — merging."
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              exit 0
            fi
            # The merge can be refused because the branch fell behind DURING the wait above. The
            # BEHIND check before this loop cannot see that: a sibling PR landing mid-loop is the
            # common case, not an edge one, and recreating several Dependabot PRs at once
            # guarantees it. Hand it back to Dependabot rather than failing the run -- a branch
            # updated with GITHUB_TOKEN would get no CI on the new head (the same anti-recursion
            # rule as above) and could never satisfy the gate.
            state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$state" = "BEHIND" ]; then
              gh pr comment "$PR_URL" --body '@dependabot rebase'
              echo "merge refused: branch fell behind during the wait; asked Dependabot to rebase."
              exit 0
            fi
            # Any other refusal is real and must stay loud. One seen in the wild: GitHub blocks a
            # GITHUB_TOKEN merge of a PR that edits a workflow file ("refusing to allow a GitHub
            # App to create or update workflow ... without `workflows` permission").
            echo "merge refused while mergeStateStatus=$state."; exit 1
          done
          echo "timed out waiting for required checks."; exit 1
