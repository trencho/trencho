# Dependabot auto-merge for the profile repo -- SELF-GATING variant.
#
# Lands EVERY update type automatically -- patch, minor and major -- once the named CI check is
# green. The only thing held back is a PRE-RELEASE target version; see the guard step below.
#
# WHY SELF-GATING HERE. This repo has NO branch protection, by decision (2026-08-21). The daily
# card job in grs.yml pushes straight to master, and a required status check makes that push
# impossible: a direct push cannot carry a check, and GitHub refuses to excuse GITHUB_TOKEN from
# one on a personal repository --
#   Actor GitHub Actions integration must be part of the ruleset source or owner organization
# -- so a ruleset bypass actor is not available. Protection was removed and the gate moved into
# this workflow, which waits for the check itself rather than delegating to `gh pr merge --auto`.
# That matters: with no required checks, `--auto` merges IMMEDIATELY and is not a gate at all.
#
# The one repo setting this still needs: Settings -> General -> "Allow auto-merge" is NOT
# required any more, because nothing calls `--auto`. Nothing to configure by hand.
#
# ---------------------------------------------------------------------------------------------
# WITH MAJORS MERGING, THE NAMED CHECK IS THE ENTIRE GATE.
#
# Under a patch/minor policy a broken major was caught by a human reading the PR. That reviewer is
# gone, so REQUIRED_CHECKS is the only thing between an upstream breaking change and master. Here
# `build` runs actionlint plus a YAML-parse assertion over every workflow, which is the whole of
# what this repo can break: its only dependencies are action pins.
#
# WHAT IS NOT VERIFIED, AND WHY IT IS ACCEPTED HERE.
#
# A merge performed with GITHUB_TOKEN raises NO workflow events (GitHub suppresses them to prevent
# recursion), so the merge commit gets no CI run. Nothing ever verifies the MERGED state of master.
# The usual fix is `strict` required status checks -- which needs the branch protection this repo
# deliberately does not have.
#
# Accepted, because the residual risk is bounded by what lives here: a README, three generated
# SVGs and three workflows. Two action-pin bumps cannot combine into a broken tree the way two
# lockfile bumps can. On a repo with real dependencies this trade-off would NOT be acceptable --
# see templates/ci/github-actions-automerge.yml for the protected variant.
# ---------------------------------------------------------------------------------------------
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Gate on the PR's AUTHOR, not `github.actor`: the actor is whoever triggered THIS run, so any
    # human touching the branch (an "Update branch" click, a rebase) makes `github.actor` false and
    # the job skips. `pull_request.user.login` is the PR opener and is stable. This is the gate
    # GitHub's own Dependabot example uses.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # -----------------------------------------------------------------------------------------
      # Pre-release guard — the one thing that does NOT auto-merge.
      #
      # Registries expose a release channel, so for npm/pip/Maven/… a pre-release is not proposed
      # unless you are already on one. The `docker` and `docker-compose` ecosystems match image
      # TAGS, which carry no channel metadata: a release candidate reads as an ordinary version and
      # is scored by the numbers in front of it. `python:3.14.6-slim` -> `python:3.15.0rc1-slim`
      # scored a routine MINOR and auto-merged into a production image (2026-08-15).
      #
      # This cannot be expressed in dependabot.yml — `ignore.versions` takes version RANGES, not
      # glob patterns (dependabot-core#15154 is open on exactly this) — so the guard lives here.
      #
      # `new-version` is empty for a GROUPED PR, so the metadata JSON is inspected too — but only
      # its newVersion VALUES. Grepping the raw JSON blob instead matches the KEY "prevVersion",
      # which contains "pre", so it held every Dependabot PR ever opened; that bug shipped in
      # 0.1.18 and is fixed here. Failing toward "hold" is deliberate — a missed merge is a
      # nuisance, a shipped release candidate is an incident.
      # -----------------------------------------------------------------------------------------
      - name: Check for a pre-release target
        id: prerelease
        env:
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          # A token counts only where it is not buried inside a longer alphabetic word: `3.15.0rc1`
          # is held, while `26.7.0-alpine` and `1.31-alpine` are ordinary releases and pass. Longest
          # alternatives first so `preview` is reported as itself rather than as `pre`.
          pattern='(^|[^a-zA-Z])(preview|insiders|snapshot|nightly|canary|alpha|beta|next|dev|pre|rc)([^a-zA-Z]|$)'
          held=false
          offender=""
          if [ -n "${NEW_VERSION:-}" ] && printf '%s' "$NEW_VERSION" | grep -qiE "$pattern"; then
            held=true
            offender="$NEW_VERSION"
          fi
          if [ -n "${UPDATED_JSON:-}" ]; then
            # jq ships on GitHub-hosted runners. On a self-hosted one without it this holds every
            # PR, so say which of the two failures it is -- an unexplained fleet-wide freeze is
            # exactly how the 0.1.18 bug went unnoticed for a day.
            if ! command -v jq >/dev/null 2>&1; then
              held=true
              offender="jq unavailable - cannot inspect grouped metadata"
            elif versions=$(printf '%s' "$UPDATED_JSON" | jq -r '.[]?.newVersion // empty'); then
              hit=$(printf '%s\n' "$versions" | grep -iE "$pattern" | head -n 1 || true)
              if [ -n "$hit" ]; then
                held=true
                offender="$hit"
              fi
            else
              held=true
              offender="unparseable metadata"
            fi
          fi
          echo "held=$held" >> "$GITHUB_OUTPUT"
          echo "offender=$offender" >> "$GITHUB_OUTPUT"
          if [ "$held" = true ]; then
            echo "pre-release target detected ('$offender') - not auto-merging."
          fi

      # Self-gating, because this repo has NO branch protection: `gh pr merge --auto` with no
      # required checks merges immediately, which is not a gate at all. So the workflow waits for
      # the named check-run itself and merges only once it is green.
      #
      # REQUIRED_CHECKS holds check-run NAMES, one per line. `build` is ci.yml's job id and it has
      # no `name:`, so the displayed name is `build` -- read off a real PR run, not off the YAML.
      # Naming a check that never appears makes this wait the full 20 minutes and then fail.
      #
      # `freshness` is deliberately NOT listed. It reports on the scheduled card job, not on the
      # PR's tree, so a dead cron would otherwise block every dependency bump in the repo.
      - name: Wait for the required check, then merge
        if: ${{ steps.prerelease.outputs.held == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_CHECKS: |
            build
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do   # up to ~20 min (60 * 20s)
            pending=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              row=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                --jq ".check_runs[] | select(.name==\"$name\") | [.status,(.conclusion // \"\")] | @tsv" | tail -1)
              if [ -z "$row" ]; then pending=1; continue; fi          # check not registered yet
              status=$(printf '%s' "$row" | cut -f1)
              concl=$(printf '%s' "$row" | cut -f2)
              [ "$status" != "completed" ] && pending=1
              if [ "$status" = "completed" ] && [ "$concl" != "success" ]; then
                echo "required check '$name' concluded '$concl' - not merging."; exit 1
              fi
            done <<< "$REQUIRED_CHECKS"
            if [ "$pending" -eq 1 ]; then echo "waiting for required checks..."; sleep 20; continue; fi
            echo "all required checks green - merging."
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              exit 0
            fi
            # Any refusal is real and must stay loud. One seen in the wild: GitHub blocks a
            # GITHUB_TOKEN merge of a PR that edits a workflow file ("refusing to allow a GitHub
            # App to create or update workflow ... without `workflows` permission").
            state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            echo "merge refused while mergeStateStatus=$state."; exit 1
          done
          echo "timed out waiting for required checks."; exit 1

      - name: Explain a held pre-release
        if: ${{ steps.prerelease.outputs.held == 'true' }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Held: this bump targets a **pre-release** version (\`$OFFENDER\`). Every other update type auto-merges; pre-releases need a human, because an image tag like \`3.15.0rc1\` is scored as an ordinary version bump. Merge manually if it is intended."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The offending VALUE, not `new-version` — which is empty on exactly the grouped PRs the
          # metadata check exists to cover, and would report the hold against a blank version.
          OFFENDER: ${{ steps.prerelease.outputs.offender }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
